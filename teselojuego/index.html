  for (var i = 0; i < L.foot.length; i++){ var f = L.foot[i]; if (inR(f,X,Y,7)) return {url:f.url}; }
  for (var j = 0; j < 3; j++) if (tray[j] && inR(trayRect(j),X,Y)) return {tray:j};
  if (!coarse) return null;
  // touch: a finger that lands just above the tray still grabs the closest piece
  var tr = L.tray; if (Y > tr.y - L.board.cell*0.6 && Y < tr.y + tr.h + 20){ var jj = clamp(Math.floor((X - tr.x)/(tr.w/3)), 0, 2); if (tray[jj]) return {tray:jj}; }
  return null;
}
function aim(){
  var b = L.board, d = drag, bx = box(d.p.s);
  var fc = (d.x - (bx[1]*b.pitch - b.gap)/2 - b.gx)/b.pitch, fr = (d.y - d.lift - (bx[0]*b.pitch - b.gap)/2 - b.gy)/b.pitch;
  var r0 = Math.round(fr), c0 = Math.round(fc), best = null;
  for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++){
    var r = r0 + dr, c = c0 + dc; if (!fits(d.p.s,r,c)) continue;
    var dd = (r - fr)*(r - fr) + (c - fc)*(c - fc); if (dd < 0.8 && (!best || dd < best.d)) best = {r:r, c:c, d:dd};
  }
  d.ok = !!best; if (best){ d.r = best.r; d.c = best.c; }
}
function cursor(){ cs.cursor = drag ? 'grabbing' : hover ? (hover.tray != null ? 'grab' : 'pointer') : ''; }
cv.addEventListener('pointerdown', function(e){
  var X = e.clientX, Y = e.clientY; mouse.x = X; mouse.y = Y; mouse.type = e.pointerType;
  userEver = true; lastUser = now; unlock();
  if (bot) cancelBot();
  var h = hit(X,Y); press = h; hover = h;
  if (h && h.sound){ soundOn = !soundOn; try { localStorage.setItem('teselo-landing-sound', soundOn ? '1' : '0'); } catch (er) {} press = null; if (soundOn) sfx('pick'); return; }
  if (h && h.tray != null && !resetting){
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    var p = tray[h.tray];
    drag = {i:h.tray, p:p, x:X, y:Y, lift:e.pointerType === 'mouse' ? 0 : L.board.cell*1.35, t0:now, from:trayPos(h.tray,p), ok:false};
    aim(); sfx('pick'); buzz(5);
  }
  cursor();
});
cv.addEventListener('pointermove', function(e){
  var X = e.clientX, Y = e.clientY; mouse.x = X; mouse.y = Y; mouse.type = e.pointerType;
  if (drag && !drag.bot){ drag.x = X; drag.y = Y; aim(); lastUser = now; return; }
  hover = hit(X,Y); cursor();
});
cv.addEventListener('pointerup', function(e){
  if (drag && !drag.bot){
    var d = drag; drag = null; lastUser = now;
    if (d.ok) place(d.p, d.r, d.c, false, geo(d)); else { d.p.ret = retFrom(d); sfx('back'); }
    cursor(); return;
  }
  var h = hit(e.clientX, e.clientY);
  if (h && h.url && press && press.url === h.url) window.location.href = h.url;
  press = null; if (e.pointerType !== 'mouse'){ hover = null; cursor(); }
});
cv.addEventListener('pointercancel', function(){ if (drag && !drag.bot){ drag.p.ret = retFrom(drag); drag = null; } press = null; });
cv.addEventListener('pointerleave', function(e){ if (e.pointerType === 'mouse' && !drag){ hover = null; mouse.x = -1; cursor(); } });
[['l-play','play'],['l-web','web']].forEach(function(q){ var el = document.getElementById(q[0]); if (!el) return;
  el.addEventListener('focus', function(){ kb = q[1]; }); el.addEventListener('blur', function(){ kb = null; }); });
window.addEventListener('deviceorientation', function(e){
  if (e.gamma == null || e.beta == null) return;
  if (g0 === null){ g0 = e.gamma; b0 = e.beta; }
  gyro = {dx:clamp((e.gamma - g0)/18, -1, 1), dy:clamp((e.beta - b0)/18, -1, 1)};
  g0 += (e.gamma - g0)*0.003; b0 += (e.beta - b0)*0.003;
});
if (darkQ.addEventListener) darkQ.addEventListener('change', theme);
window.addEventListener('resize', size);

// ---------------------------------------------------------------- automated checks (only with #qa in the URL)
if (location.hash === '#qa') window.__qa = {
  state:function(){ return {cleared:cleared, won:won, score:score, demoDone:demoDone, bot:!!bot, drag:!!drag, tray:tray.map(function(p){ return p ? p.s.length : 0; }),
    filled:board.map(function(k){ return k ? 1 : 0; }).join(''), sound:soundOn, L:{play:L.play, web:L.web, qr:L.qrBox || null, board:{x:L.board.x, y:L.board.y, s:L.board.s}, tray:L.tray, sound:L.sound, portrait:L.portrait}}; },
  trayCenter:function(i){ var p = tray[i]; if (!p) return null; var tp = trayPos(i,p), bx = box(p.s); return [tp.ox + (bx[1] - 1)*tp.pitch/2, tp.oy + (bx[0] - 1)*tp.pitch/2]; },
  target:function(i,r,c){ var p = tray[i]; if (!p) return null; var b = L.board, bx = box(p.s); return [b.gx + c*b.pitch + (bx[1]*b.pitch - b.gap)/2, b.gy + r*b.pitch + (bx[0]*b.pitch - b.gap)/2]; },
  lift:function(){ return L.board.cell*1.35; }
};

// ---------------------------------------------------------------- go
theme(); size(); seed();
for (var i = 0; i < 12; i++){ var z = Math.random(); amb.push({x:Math.random()*W, y:Math.random()*H, z:z, s:16 + z*34, v:7 + z*24, r:Math.random()*6, vr:(Math.random() - .5)*0.25, k:rnd(KEYS)}); }
requestAnimationFrame(frame);
})();
