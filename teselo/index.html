<!-- 0.16.0 E (Cesio boot): the developer splash + the loading bar and «by Cesio» sello. TEMPLATE: tools/make_boot.py fills the
     casilla path (the Cs 55 casilla, brand kit logo/simbolo) and writes src/shell/boot.html, the block every game page carries
     right after the body tag (the tool syncs it). Self-contained: no stylesheet / script entry to keep in step, so it paints
     with the first frame, before game.js. SVG + CSS only; the native splash (Android 12+) is the same casilla. -->
<style>
#gk-boot, #gk-ld { pointer-events: none; }
/* developer splash: papel, the casilla centred (the native splash icon is the same size: 120 dp), the small sello below.
   Pure CSS timing from the first paint: held 0.8 s, 0.3 s fade, gone by 1.1 s whatever the page is doing (no JS needed) */
#gk-boot { position: fixed; inset: 0; z-index: calc(var(--z-splash, 9999) + 2); background: #EFE4CC; display: grid; place-items: center;
  animation: gk-boot-out .3s ease-in .8s forwards; }
#gk-boot svg { width: 120px; height: 120px; display: block; }
#gk-boot b { position: absolute; left: 0; right: 0; text-align: center; bottom: max(24px, calc(env(safe-area-inset-bottom) + 24px));
  font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; letter-spacing: .2em; color: #161412; opacity: .62; }
@keyframes gk-boot-out { to { opacity: 0; visibility: hidden; } }
/* the game's own loading screen: a thin red bar that always moves (eased to 90 % in ~2.7 s, then a slow creep to 99 %, a light
   sweep on top; the animation runs on the compositor, so it keeps moving while the main thread parses the game) and the small
   «by Cesio» sello at the bottom. GamekitBoot.finish() takes the bar to 100 % when the first screen is ready */
#gk-ld { position: fixed; left: 0; right: 0; bottom: 0; z-index: calc(var(--z-splash, 9999) + 1); display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-bottom: max(22px, calc(env(safe-area-inset-bottom) + 22px)); transition: opacity .25s ease-out; }
#gk-ld.out { opacity: 0; }
#gk-ld i { display: block; position: relative; overflow: hidden; width: min(52vw, 210px); height: 3px; border-radius: 2px; background: rgba(22, 20, 18, .16); }
#gk-ld u { display: block; height: 100%; background: #C8321E; transform-origin: 0 50%; transform: scaleX(.02); animation: gk-ld-run 120s linear forwards; }
#gk-ld u::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 34%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .45), rgba(255, 255, 255, 0));
  animation: gk-ld-sweep 1.1s ease-in-out infinite; }
#gk-ld span { display: flex; align-items: center; gap: 7px; font: 500 10.5px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
  letter-spacing: .2em; text-transform: uppercase; color: #161412; opacity: .7; }
#gk-ld span svg { width: 20px; height: 20px; display: block; }
@keyframes gk-ld-run { 0% { transform: scaleX(.02); animation-timing-function: cubic-bezier(.12, .6, .25, 1); } 2.25% { transform: scaleX(.9); animation-timing-function: linear; } 100% { transform: scaleX(.99); } }
@keyframes gk-ld-sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
</style>

<script>
(function () {
  var d = document, w = window, ld = d.getElementById('gk-ld'), fill = ld && ld.getElementsByTagName('u')[0], done = 0;
  function rm(id) { var e = d.getElementById(id); if (e && e.parentNode) e.parentNode.removeChild(e); }
  setTimeout(function () { rm('gk-boot'); }, 1500);   // already invisible by CSS since ~1.1 s
  function cur() { try { var m = /matrix\(([-\d.e]+)/.exec(w.getComputedStyle(fill).transform); return m ? +m[1] : 0.9; } catch (e) { return 0.9; } }
  // finish(cb): the bar runs on to 100 % from where it is (never back), then the loading bar + sello fade and cb() runs
  w.GamekitBoot = { finish: function (cb) {
    if (done || !fill) { done = 1; if (cb) cb(); return; }
    done = 1;
    var c = cur();
    fill.style.animation = 'none'; fill.style.transform = 'scaleX(' + c + ')';
    void fill.offsetWidth;
    fill.style.transition = 'transform .16s ease-out'; fill.style.transform = 'scaleX(1)';
    setTimeout(function () { ld.className = 'out'; setTimeout(function () { rm('gk-ld'); }, 300); if (cb) cb(); }, 180);
  } };
})();
</script>

<!-- 0.10.3 ART: the loading screen (art-final.css, generated): the logo over loading.png until the first menu frame (game/ui.js) -->
<div id="gk-splash" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<div id="app">
  <header id="hud">
    <div class="left">
      <button type="button" class="ic" id="b-home" aria-label="Home" data-gk-act="break"><svg><use href="#i-home"/></svg></button>
      <!-- 0.10.1 HUD: Aventura in-level bar (game/ui.js updateHud, #hud.lv-hud): exit X | goal capsule | moves pill -->
      <button type="button" class="gk-topbtn gk-tok tz-x" id="b-exit" aria-label="Salir"><svg viewBox="0 0 24 24"><use href="#gk-ic-ui-close"/></svg></button>
      <!-- 1.0.1 C: the days-in-a-row chip wears the calendar (the flame is the level-win Racha's); its name says what it counts -->
      <button type="button" class="chip flame tz-dayschip" id="streak" aria-label="Días seguidos"><svg viewBox="0 0 512 512"><use href="#gk-ic-calendar"/></svg><span id="streak-v">0</span></button>
    </div>
    <div id="scorebox">
      <div id="score">0</div>
      <div id="best"><svg class="bi"><use href="#i-crown"/></svg><span id="best-v">0</span></div>
      <div id="lvgoal" class="tz-goal" role="status"><span id="lv-gi"></span><span class="lv-gn"><b id="lv-have">0</b><small>/<span id="lv-target">0</span></small></span><span class="lv-bar"><i id="lv-fill"></i></span></div>
    </div>
    <div class="right">
      <div id="lvmoves" class="tz-mvp" role="status" aria-label="Movimientos"><svg viewBox="0 0 512 512"><use href="#gk-ic-steps"/></svg><b id="lv-mv">0</b></div>
      <button type="button" class="chip" id="b-coins" aria-label="Coins"><svg><use href="#i-coin"/></svg><span id="coins">0</span></button>
      <button type="button" class="ic" id="b-sound" aria-label="Sound"><svg class="on"><use href="#gk-ic-ui-sound"/></svg><svg class="off"><use href="#gk-ic-ui-mute"/></svg></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <div id="boosters"></div>
    <!-- 0.9.1 T item 9: "Sin movimientos" grace banner (game/ui.js noMovesStart): countdown ring, hint, Abandonar -->
    <div id="nomoves" class="tz-nm" hidden role="alert">
      <div class="nm-row">
        <span class="nm-clock"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" id="nm-ring" cx="22" cy="22" r="19"/></svg><b id="nm-n">5</b></span>
        <span class="nm-txt"><b id="nm-t"></b><small id="nm-h"></small></span>
      </div>
      <button type="button" class="mini ghost tz-nmx" id="nm-x"></button>
    </div>
  </main>

  <section id="menu" class="panel show" data-gk-blobs><!-- 1.1.0 HOME: the rail as side blobs (gamekit hub-ui BLOBS) -->
    <!-- 0.9.1 M: quick access band (money-ui.js): Pase + Hucha | XP bar | Ofertas. The wordmark stays on the splash / app icon -->
    <div class="gk-hq" id="m-quick"><div class="gk-hq-l"></div><div class="gk-xp" id="m-xp"></div><div class="gk-hq-r"></div></div>
    <button type="button" class="card" id="m-adv">
      <span class="ttl"><svg class="mi" viewBox="0 0 512 512" aria-hidden="true"><use href="#gk-ic-map"/></svg><span class="k" data-t="adventure">Adventure</span></span>
      <span class="sub" id="m-adv-sub"></span>
      <span class="tag" id="m-adv-tag"></span>
    </button>
    <div class="gk-mpair"><!-- 0.10.3 PAGES: Diario + Infinito share one row on short screens (gk-theme.css) -->
    <button type="button" class="card alt" id="m-daily">
      <span class="ttl"><svg class="mi" viewBox="0 0 512 512" aria-hidden="true"><use href="#gk-ic-calendar"/></svg><span class="k" data-t="daily">Daily</span></span>
      <span class="sub" id="m-daily-sub"></span>
      <span class="tag" id="m-daily-tag"></span>
    </button>
    <button type="button" class="card alt" id="m-endless">
      <span class="ttl"><svg class="mi" viewBox="0 0 512 512" aria-hidden="true"><use href="#gk-ic-infinity"/></svg><span class="k" data-t="endless">Endless</span></span>
      <span class="sub" id="m-endless-sub"></span>
    </button>
    </div>
    <div class="dock" id="m-dock">
      <button type="button" class="ic big" id="m-quests" aria-label="Quests"><svg><use href="#i-quest"/></svg><b class="badge" id="m-quests-badge"></b></button>
      <button type="button" class="ic big" id="m-shop" aria-label="Shop"><svg><use href="#i-shop"/></svg></button>
    </div>
  </section>

  <section id="levels" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="adventure">Adventure</span><span class="chip"><svg><use href="#i-star"/></svg><span id="lv-stars">0</span></span></div>
    <div class="lv-grid" id="lv-grid"></div>
  </section>

  <section id="quests" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="quests">Quests</span></div>
    <div class="chests" id="chests"></div>
    <div class="pass" id="pass"></div>
    <div class="qlist" id="qlist"></div>
  </section>

  <section id="shop" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="shop">Shop</span></div>
    <div class="shop" id="shoplist"></div>
  </section>

  <section id="over" class="panel">
    <div class="ov-title" id="o-title"></div>
    <div class="stars" id="o-stars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
    <div class="ov-score" id="o-score">0</div>
    <div class="ov-best" id="o-best"></div>
    <div class="grid" id="o-grid"></div>
    <div class="ov-streak" id="o-streak"></div>
    <div class="ov-coins" id="o-coins"></div>
    <div class="ov-card" id="o-card" hidden></div>
    <div class="row">
      <button type="button" class="btn pri" id="o-next" data-gk-act="break"><svg><use href="#i-play"/></svg><span data-t="nextLv">Next</span></button>
      <button type="button" class="btn pri" id="o-cont"></button>
      <button type="button" class="btn pri" id="o-share"><svg><use href="#i-share"/></svg><span data-t="share">Share</span></button>
      <button type="button" class="btn" id="o-again" data-gk-act="break"><svg><use href="#i-again"/></svg><span data-t="again">Again</span></button>
      <button type="button" class="btn" id="o-double"><svg class="adi"><use href="#i-ad"/></svg><span>×2</span><svg><use href="#i-coin"/></svg></button>
    </div>
  </section>
  <div class="toast" id="toast"></div>
</div>
