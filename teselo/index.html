<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<meta name="description" content="Teselo: a calm daily block puzzle. Fit the pieces, clear rows and columns.">
<title>Teselo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='12' height='12' rx='3' fill='%237fb3a3'/%3E%3Crect x='17' y='3' width='12' height='12' rx='3' fill='%23e5b567'/%3E%3Crect x='3' y='17' width='12' height='12' rx='3' fill='%2386a8d8'/%3E%3Crect x='17' y='17' width='12' height='12' rx='3' fill='%23e39a85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="#e5b567"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#c9963f" stroke-width="2"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.8.2 1.6 1 2.6 2 2.8C10.6 8.6 11 5.6 12 3z"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="m4 8 4.5 3.5L12 5l3.5 6.5L20 8l-1.5 10h-13z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z"/></symbol>
  <symbol id="i-lines" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="3.4" rx="1.4"/><rect x="4" y="10.3" width="16" height="3.4" rx="1.4"/><rect x="4" y="15.6" width="16" height="3.4" rx="1.4"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9z" fill="#5fb3c8"/><path d="M7 4h10l4 5H3z" fill="#8fd3e2"/></symbol>
  <symbol id="i-moves" viewBox="0 0 24 24"><path d="M6 12a6 6 0 1 0 1.8-4.3M6 4.5v3.7h3.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M18.5 12A6.5 6.5 0 1 1 12 5.5h3M13 2.5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-bomb" viewBox="0 0 24 24"><circle cx="11" cy="14" r="6.5"/><path d="M15 8.5 17 6.5M17.5 3.5v1.5M20.5 6.5H19M19.6 4.4l-1 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4.5 11.5 9 16M5 11.5h9a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3.5 7h3.5c4.5 0 5.5 10 10 10h3.5M3.5 17h3.5c1.6 0 2.7-1.2 3.6-2.8M13.4 9.8C14.3 8.2 15.4 7 17 7h3.5M18 4l2.5 3L18 10M18 14l2.5 3L18 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chest" viewBox="0 0 24 24"><path d="M3 10a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v1H3z"/><rect x="3" y="12" width="18" height="8" rx="1.5"/><rect x="10.5" y="10" width="3" height="5" rx="1" fill="#fff" opacity=".7"/></symbol>
  <symbol id="i-quest" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8.5 9 1.5 1.5L13 7.5M8.5 15h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-shop" viewBox="0 0 24 24"><path d="M4 9h16l-1.2 10.2a1 1 0 0 1-1 .8H6.2a1 1 0 0 1-1-.8zM8.5 9V7.5a3.5 3.5 0 0 1 7 0V9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-ad" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m10 9 5 3-5 3z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></symbol>
</svg>
<div id="app">
  <header id="hud">
    <div class="left">
      <button class="ic" id="b-home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg></button>
      <button class="chip flame" id="streak" aria-label="Streak"><svg><use href="#i-flame"/></svg><span id="streak-v">0</span></button>
    </div>
    <div id="scorebox">
      <div id="score">0</div>
      <div id="best"><svg class="bi"><use href="#i-crown"/></svg><span id="best-v">0</span></div>
    </div>
    <div class="right">
      <button class="chip" id="b-coins" aria-label="Coins"><svg><use href="#i-coin"/></svg><span id="coins">0</span></button>
      <button class="ic" id="b-sound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none"/><path class="off" d="m16 9.5 5 5m0-5-5 5" fill="none"/></svg></button>
      <button class="ic" id="b-theme" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <div id="boosters"></div>
  </main>

  <section id="menu" class="panel show">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>Teselo</h1>
    <button class="card" id="m-adv">
      <span class="k" data-t="adventure">Adventure</span>
      <span class="sub" id="m-adv-sub"></span>
      <span class="tag" id="m-adv-tag"></span>
    </button>
    <button class="card alt" id="m-daily">
      <span class="k" data-t="daily">Daily</span>
      <span class="sub" id="m-daily-sub"></span>
      <span class="tag" id="m-daily-tag"></span>
    </button>
    <button class="card alt" id="m-endless">
      <span class="k" data-t="endless">Endless</span>
      <span class="sub" id="m-endless-sub"></span>
    </button>
    <div class="dock">
      <button class="ic big" id="m-quests" aria-label="Quests"><svg><use href="#i-quest"/></svg><b class="badge" id="m-quests-badge"></b></button>
      <button class="ic big" id="m-shop" aria-label="Shop"><svg><use href="#i-shop"/></svg></button>
    </div>
  </section>

  <section id="levels" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="adventure">Adventure</span><span class="chip"><svg><use href="#i-star"/></svg><span id="lv-stars">0</span></span></div>
    <div class="lv-grid" id="lv-grid"></div>
  </section>

  <section id="quests" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="quests">Quests</span></div>
    <div class="chests" id="chests"></div>
    <div class="pass" id="pass"></div>
    <div class="qlist" id="qlist"></div>
  </section>

  <section id="shop" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="shop">Shop</span></div>
    <div class="shop" id="shoplist"></div>
  </section>

  <section id="over" class="panel">
    <div class="ov-title" id="o-title"></div>
    <div class="stars" id="o-stars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
    <div class="ov-score" id="o-score">0</div>
    <div class="ov-best" id="o-best"></div>
    <div class="grid" id="o-grid"></div>
    <div class="ov-streak" id="o-streak"></div>
    <div class="ov-coins" id="o-coins"></div>
    <div class="row">
      <button class="btn pri" id="o-next"><svg><use href="#i-play"/></svg><span data-t="nextLv">Next</span></button>
      <button class="btn pri" id="o-cont"></button>
      <button class="btn pri" id="o-share"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 8.5 12 4l4.5 4.5M5 13v6h14v-6" fill="none"/></svg><span data-t="share">Share</span></button>
      <button class="btn" id="o-again"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4h4" fill="none"/></svg><span data-t="again">Again</span></button>
      <button class="btn" id="o-double"><svg class="adi"><use href="#i-ad"/></svg><span>×2</span><svg><use href="#i-coin"/></svg></button>
    </div>
  </section>
  <div class="toast" id="toast"></div>
</div>
<script>window.GAMEKIT_ADS = 'none'; window.GAMEKIT_IAP = 'none';</script>
<script src="game.js"></script>
</body>
</html>
