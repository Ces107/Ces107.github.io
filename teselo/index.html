<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<meta name="description" content="Teselo: a calm daily block puzzle. Fit the pieces, clear rows and columns.">
<title>Teselo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='12' height='12' rx='3' fill='%237fb3a3'/%3E%3Crect x='17' y='3' width='12' height='12' rx='3' fill='%23e5b567'/%3E%3Crect x='3' y='17' width='12' height='12' rx='3' fill='%2386a8d8'/%3E%3Crect x='17' y='17' width='12' height='12' rx='3' fill='%23e39a85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teselo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if ('serviceWorker' in navigator && window.self === window.top && !navigator.webdriver) addEventListener('load', function () { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {}); });</script>
</head>
<body>
<!-- 0.10.3 ART: the loading screen (art-final.css, generated): the logo over loading.png until the first menu frame (game/ui.js) -->
<div id="gk-splash" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- 0.9.0 A: i-coin, i-flame, i-star, i-play, i-home, i-lock, i-ad, i-share... are drawn by gamekit (shell/art.js GamekitArt.ALIAS: Tabler / game-icons public art) -->
  <symbol id="i-lines" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="3.4" rx="1.4"/><rect x="4" y="10.3" width="16" height="3.4" rx="1.4"/><rect x="4" y="15.6" width="16" height="3.4" rx="1.4"/></symbol>
  <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9z" fill="#5fb3c8"/><path d="M7 4h10l4 5H3z" fill="#8fd3e2"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 512 512"><use href="#gk-ic-rotate"/></symbol>
  <symbol id="i-bomb" viewBox="0 0 512 512"><use href="#gk-ic-bomb"/></symbol>
  <symbol id="i-undo" viewBox="0 0 512 512"><use href="#gk-ic-undo"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 512 512"><use href="#gk-ic-cycle"/></symbol>
  <symbol id="i-blast" viewBox="0 0 512 512"><use href="#gk-ic-blast"/></symbol>
  <symbol id="i-colour" viewBox="0 0 512 512"><use href="#gk-ic-colour"/></symbol>
</svg>
<div id="app">
  <header id="hud">
    <div class="left">
      <button type="button" class="ic" id="b-home" aria-label="Home" data-gk-act="break"><svg><use href="#i-home"/></svg></button>
      <!-- 0.10.1 HUD: Aventura in-level bar (game/ui.js updateHud, #hud.lv-hud): exit X | goal capsule | moves pill -->
      <button type="button" class="gk-topbtn gk-tok tz-x" id="b-exit" aria-label="Salir"><svg viewBox="0 0 24 24"><use href="#gk-ic-ui-close"/></svg></button>
      <button type="button" class="chip flame" id="streak" aria-label="Racha diaria"><svg><use href="#i-flame"/></svg><span id="streak-v">0</span></button>
    </div>
    <div id="scorebox">
      <div id="score">0</div>
      <div id="best"><svg class="bi"><use href="#i-crown"/></svg><span id="best-v">0</span></div>
      <div id="lvgoal" class="tz-goal" role="status"><span id="lv-gi"></span><span class="lv-gn"><b id="lv-have">0</b><small>/<span id="lv-target">0</span></small></span><span class="lv-bar"><i id="lv-fill"></i></span></div>
    </div>
    <div class="right">
      <div id="lvmoves" class="tz-mvp" role="status" aria-label="Movimientos"><svg viewBox="0 0 512 512"><use href="#gk-ic-steps"/></svg><b id="lv-mv">0</b></div>
      <button type="button" class="chip" id="b-coins" aria-label="Coins"><svg><use href="#i-coin"/></svg><span id="coins">0</span></button>
      <button type="button" class="ic" id="b-sound" aria-label="Sound"><svg class="on"><use href="#gk-ic-ui-sound"/></svg><svg class="off"><use href="#gk-ic-ui-mute"/></svg></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <div id="boosters"></div>
    <!-- 0.9.1 T item 9: "Sin movimientos" grace banner (game/ui.js noMovesStart): countdown ring, hint, Abandonar -->
    <div id="nomoves" class="tz-nm" hidden role="alert">
      <div class="nm-row">
        <span class="nm-clock"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" id="nm-ring" cx="22" cy="22" r="19"/></svg><b id="nm-n">5</b></span>
        <span class="nm-txt"><b id="nm-t"></b><small id="nm-h"></small></span>
      </div>
      <button type="button" class="mini ghost tz-nmx" id="nm-x"></button>
    </div>
  </main>

  <section id="menu" class="panel show">
    <!-- 0.9.1 M: quick access band (money-ui.js): Pase + Hucha | XP bar | Ofertas. The wordmark stays on the splash / app icon -->
    <div class="gk-hq" id="m-quick"><div class="gk-hq-l"></div><div class="gk-xp" id="m-xp"></div><div class="gk-hq-r"></div></div>
    <button type="button" class="card" id="m-adv">
      <span class="ttl"><svg class="mi" viewBox="0 0 512 512" aria-hidden="true"><use href="#gk-ic-map"/></svg><span class="k" data-t="adventure">Adventure</span></span>
      <span class="sub" id="m-adv-sub"></span>
      <span class="tag" id="m-adv-tag"></span>
    </button>
    <div class="gk-mpair"><!-- 0.10.3 PAGES: Diario + Infinito share one row on short screens (gk-theme.css) -->
    <button type="button" class="card alt" id="m-daily">
      <span class="ttl"><svg class="mi" viewBox="0 0 512 512" aria-hidden="true"><use href="#gk-ic-calendar"/></svg><span class="k" data-t="daily">Daily</span></span>
      <span class="sub" id="m-daily-sub"></span>
      <span class="tag" id="m-daily-tag"></span>
    </button>
    <button type="button" class="card alt" id="m-endless">
      <span class="ttl"><svg class="mi" viewBox="0 0 512 512" aria-hidden="true"><use href="#gk-ic-infinity"/></svg><span class="k" data-t="endless">Endless</span></span>
      <span class="sub" id="m-endless-sub"></span>
    </button>
    </div>
    <div class="dock" id="m-dock">
      <button type="button" class="ic big" id="m-quests" aria-label="Quests"><svg><use href="#i-quest"/></svg><b class="badge" id="m-quests-badge"></b></button>
      <button type="button" class="ic big" id="m-shop" aria-label="Shop"><svg><use href="#i-shop"/></svg></button>
    </div>
  </section>

  <section id="levels" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="adventure">Adventure</span><span class="chip"><svg><use href="#i-star"/></svg><span id="lv-stars">0</span></span></div>
    <div class="lv-grid" id="lv-grid"></div>
  </section>

  <section id="quests" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="quests">Quests</span></div>
    <div class="chests" id="chests"></div>
    <div class="pass" id="pass"></div>
    <div class="qlist" id="qlist"></div>
  </section>

  <section id="shop" class="panel sheet">
    <div class="sheet-head"><span class="k" data-t="shop">Shop</span></div>
    <div class="shop" id="shoplist"></div>
  </section>

  <section id="over" class="panel">
    <div class="ov-title" id="o-title"></div>
    <div class="stars" id="o-stars"><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg><svg><use href="#i-star"/></svg></div>
    <div class="ov-score" id="o-score">0</div>
    <div class="ov-best" id="o-best"></div>
    <div class="grid" id="o-grid"></div>
    <div class="ov-streak" id="o-streak"></div>
    <div class="ov-coins" id="o-coins"></div>
    <div class="ov-card" id="o-card" hidden></div>
    <div class="row">
      <button type="button" class="btn pri" id="o-next" data-gk-act="break"><svg><use href="#i-play"/></svg><span data-t="nextLv">Next</span></button>
      <button type="button" class="btn pri" id="o-cont"></button>
      <button type="button" class="btn pri" id="o-share"><svg><use href="#i-share"/></svg><span data-t="share">Share</span></button>
      <button type="button" class="btn" id="o-again" data-gk-act="break"><svg><use href="#i-again"/></svg><span data-t="again">Again</span></button>
      <button type="button" class="btn" id="o-double"><svg class="adi"><use href="#i-ad"/></svg><span>×2</span><svg><use href="#i-coin"/></svg></button>
    </div>
  </section>
  <div class="toast" id="toast"></div>
</div>
<script>window.GAMEKIT_ADS = 'none'; window.GAMEKIT_IAP = 'none'; window.GAMEKIT_API = 'https://gamekit-api.onrender.com';</script>
<script src="game.js"></script>
</body>
</html>
